<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brozone Voice Party 💜🪩✨</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&family=Cute+Font&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon: #ff2e63;
      --purple: #a166ff;
      --cyan: #00f0ff;
      --bg: #0d001a;
      --card: #1a0033;
      --glow: rgba(255,46,99,0.7);
    }
    body {
      margin:0; padding:0;
      background: linear-gradient(135deg, #0d001a, #1a0033, #30004d);
      color:#fff;
      font-family:'Vazirmatn', sans-serif;
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      background: url('https://images6.alphacoders.com/791/791083.jpg') center/cover;
      opacity:0.08;
      z-index:-2;
      animation: bgFloat 60s infinite alternate;
    }
    @keyframes bgFloat { 0%{transform:scale(1.1) translate(0,0)} 100%{transform:scale(1.2) translate(5%,5%)} }
    .container { max-width:1000px; margin:0 auto; padding:20px; position:relative; z-index:1; }
    h1 {
      font-size:4.5em;
      text-align:center;
      background: linear-gradient(90deg, var(--neon), var(--purple), var(--cyan));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin:40px 0;
      text-shadow: 0 0 30px var(--glow);
      animation: titlePulse 3s infinite alternate;
    }
    @keyframes titlePulse { from {transform:scale(1)} to {transform:scale(1.05)} }
    .card {
      background: rgba(26,0,51,0.7);
      backdrop-filter: blur(10px);
      border-radius:25px;
      padding:30px;
      margin:25px 0;
      border:1px solid rgba(255,46,99,0.3);
      box-shadow: 0 0 40px rgba(255,46,99,0.4), inset 0 0 20px rgba(161,102,255,0.2);
      transition: all 0.4s;
    }
    .card:hover { transform: translateY(-10px); box-shadow: 0 0 60px var(--glow); }
    .users { display:flex; flex-wrap:wrap; gap:25px; justify-content:center; }
    .user {
      text-align:center;
      transition: all 0.5s;
      animation: float 6s infinite ease-in-out;
      position: relative;
    }
    .user .avatar-wrapper {
      position: relative;
      display: inline-block;
    }
    .user img {
      width:110px; height:110px;
      border-radius:50%;
      border:5px solid transparent;
      background: linear-gradient(45deg, var(--neon), var(--purple));
      padding:5px;
      transition: all 0.15s ease; /* سریع‌تر برای visualizer */
      box-shadow: 0 0 20px rgba(255,46,99,0.5);
    }
    .user:hover img { transform:scale(1.2) rotate(10deg); }
    .user span {
      margin-top:15px;
      font-weight:bold;
      font-size:1.3em;
      text-shadow:0 0 10px var(--glow);
      display: block;
    }
    .mute-icon {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 1.8em;
      color: #ff2e63;
      text-shadow: 0 0 10px var(--glow);
      z-index: 2;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
    .controls { text-align:center; margin:50px 0; }
    button {
      background: linear-gradient(45deg, var(--neon), var(--purple));
      color:white;
      border:none;
      padding:20px 45px;
      margin:20px;
      border-radius:50px;
      font-size:1.5em;
      cursor:pointer;
      box-shadow: 0 0 30px var(--glow);
      transition: all 0.4s;
      position:relative;
      overflow:hidden;
    }
    button::before {
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: translateX(-100%);
      transition: 0.7s;
    }
    button:hover::before { transform: translateX(100%); }
    button:hover { transform:scale(1.15) rotate(5deg); box-shadow: 0 0 50px var(--glow); }
    #chat {
      height:300px;
      overflow-y:scroll;
      background: rgba(26,0,51,0.6);
      padding:25px;
      border-radius:20px;
      margin-bottom:20px;
      backdrop-filter: blur(8px);
      border:1px solid rgba(0,240,255,0.2);
    }
    .msg {
      margin:15px 0;
      padding:15px;
      background: rgba(161,102,255,0.2);
      border-radius:20px;
      max-width:80%;
      backdrop-filter: blur(5px);
      animation: msgPop 0.5s ease-out;
    }
    @keyframes msgPop { from {opacity:0; transform:translateY(20px)} to {opacity:1; transform:translateY(0)} }
    input {
      padding:20px;
      width:75%;
      border-radius:50px;
      border:none;
      background: rgba(255,255,255,0.1);
      color:white;
      font-size:1.3em;
      backdrop-filter: blur(10px);
      transition: all 0.4s;
    }
    input:focus { outline:none; box-shadow: 0 0 30px var(--glow); }
    body.disco-active {
      animation: discoBg 8s linear infinite;
    }
    @keyframes discoBg {
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }
    body.disco-active .user img { animation: neonGlow 1s ease-in-out infinite alternate; }
    body.disco-active button { animation: pulse 1.2s infinite; }
    @keyframes neonGlow { from {box-shadow:0 0 20px #ff2e63, 0 0 40px #a166ff} to {box-shadow:0 0 40px #00f0ff, 0 0 80px #ff2e63} }
    #uploadProgress {
      display: none;
      margin: 20px auto;
      width: 80%;
      text-align: center;
    }
    progress {
      width: 100%;
      height: 20px;
      border-radius: 10px;
      background: rgba(255,46,99,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Brozone Voice Party 💜🪩✨</h1>
    <div class="card">
      <input type="text" id="nameInput" placeholder="اسم انیمه‌ای شیطونیت چیه؟ 😈" maxlength="20">
      <button onclick="setName()">استارت پارتی!</button>
    </div>
    <div class="card">
      <div id="online">آنلاین: ۱ نفر (تو تنهایی فعلاً 😂)</div>
      <div class="users" id="userList"></div>
    </div>
    <div class="controls">
      <button id="mute">🔇 مات کردن میکروفون</button>
      <button id="disco">🪩 دیسکو روشن!</button>
      <button id="uploadMusicBtn">🎵 آپلود و پخش موزیک!</button>
    </div>
    <div id="uploadProgress"><progress id="progressBar" value="0" max="100"></progress><br>در حال آپلود... صبر کن Brozone 😏</div>
    <div class="card" id="musicPlayerCard" style="display:none;">
      <h3>🎶 موزیک پارتی (همه با هم گوش بدیم 😏)</h3>
      <audio id="partyMusic" controls autoplay style="width:100%;"></audio>
      <button onclick="document.getElementById('partyMusic').play()">▶ پلی دوباره</button>
    </div>
    <div class="card">
      <h3>چت متنی (که داد نزنیم 😏)</h3>
      <div id="chat"></div>
      <input type="text" id="msgInput" placeholder="یه نیش بامزه بنداز..." onkeypress="if(event.key==='Enter') sendMsg()">
    </div>
  </div>
  <!-- Hidden audio for loopback test -->
  <audio id="localAudio" style="display:none;"></audio>
  <input type="file" id="musicInput" accept="audio/*" style="display:none;">
  <audio id="joinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3" preload="auto"></audio>
  <audio id="leaveSound" src="https://assets.mixkit.co/sfx/preview/mixkit-negative-answer-little-beep-932.mp3" preload="auto"></audio>
  <script>
    const socket = io();
    let myStream, peers = {}, myName = "ناشناس شیطون";
    let isMuted = false, discoMode = false, userInteracted = false;
    const animeAvatars = [
      "https://i.imgur.com/JdQAR2s.jpeg", "https://i.imgur.com/6f4p1kZ.jpeg", "https://i.imgur.com/8pK9p3Q.jpeg",
      "https://i.imgur.com/Vf2mK9r.jpeg", "https://i.imgur.com/Ht9pL5X.jpeg", "https://i.imgur.com/Kr8pQ2m.jpeg",
      "https://i.imgur.com/3qWvZ8Y.jpeg", "https://i.imgur.com/9pR5v2B.jpeg", "https://i.imgur.com/fG4mP7k.jpeg",
      "https://i.imgur.com/Lp9kM3v.jpeg", "https://i.imgur.com/2mV8qRt.jpeg", "https://i.imgur.com/7z3f8kP.jpeg"
    ];
    const userAvatars = {};
    function getRandomAvatar() {
      return animeAvatars[Math.floor(Math.random() * animeAvatars.length)];
    }
    function setName() {
      myName = document.getElementById('nameInput').value.trim() || "Brozone جون";
      socket.emit('set-name', myName);
      document.querySelector('.card input').style.display = 'none';
      document.querySelector('.card button').style.display = 'none';
      userInteracted = true; // تعامل کاربر
      initAudio(); // حالا صدارو init کن
    }
    function sendMsg() {
      const input = document.getElementById('msgInput');
      if (input.value.trim()) {
        socket.emit('chat', input.value);
        input.value = '';
        userInteracted = true;
      }
    }
    function updateUserList(users) {
      document.getElementById('online').textContent = `آنلاین: ${users.length} نفر 🔥`;
      const list = document.getElementById('userList');
      list.innerHTML = users.map(u => {
        if (!userAvatars[u.id]) userAvatars[u.id] = getRandomAvatar();
        return `
          <div class="user" data-user-id="${u.id}">
            <div class="avatar-wrapper">
              <img src="${userAvatars[u.id]}" alt="avatar">
              ${u.isMuted ? '<span class="mute-icon">🔇</span>' : ''}
            </div>
            <span>${u.name}</span>
          </div>
        `;
      }).join('');
    }
    socket.on('user-list', updateUserList);
    socket.on('chat', (data) => {
      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="msg"><strong>${data.name}:</strong> ${data.msg}</div>`;
      chat.scrollTop = chat.scrollHeight;
      userInteracted = true;
    });
    socket.on('user-joined', () => document.getElementById('joinSound').play());
    socket.on('user-left', () => document.getElementById('leaveSound').play());
    document.getElementById('mute').onclick = () => {
      if (!myStream) return;
      userInteracted = true; // تعامل
      isMuted = !isMuted;
      myStream.getAudioTracks()[0].enabled = !isMuted;
      const btn = document.getElementById('mute');
      btn.textContent = isMuted ? '🔊 آنمات کردن' : '🔇 مات کردن میکروفون';
      btn.style.background = isMuted ? '#16213e' : 'linear-gradient(45deg, var(--neon), var(--purple))';
      socket.emit('toggle-mute', isMuted);
      forcePlayAllAudio(); // force play بعد تعامل
    };
    document.getElementById('disco').onclick = () => {
      userInteracted = true;
      discoMode = !discoMode;
      const btn = document.getElementById('disco');
      if (discoMode) {
        document.body.classList.add('disco-active');
        btn.textContent = '🪩 دیسکو خاموش!';
      } else {
        document.body.classList.remove('disco-active');
        btn.textContent = '🪩 دیسکو روشن!';
      }
    };
    // آپلود با progress (همون قبلی)
    document.getElementById('uploadMusicBtn').onclick = () => {
      userInteracted = true;
      document.getElementById('musicInput').click();
    };
    document.getElementById('musicInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith('audio/')) {
        alert('موزیک واقعی بده Brozone 😤');
        return;
      }
      const formData = new FormData();
      formData.append('music', file);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload-music', true);
      xhr.upload.onprogress = (event) => {
        if (event.lengthComputable) {
          const percent = (event.loaded / event.total) * 100;
          document.getElementById('progressBar').value = percent;
        }
      };
      xhr.onload = () => {
        document.getElementById('uploadProgress').style.display = 'none';
        if (xhr.status === 200) {
          const data = JSON.parse(xhr.responseText);
          playPartyMusic(data.url);
        } else {
          alert('آپلود نشد 😭');
        }
      };
      document.getElementById('uploadProgress').style.display = 'block';
      document.getElementById('progressBar').value = 0;
      xhr.send(formData);
    };
    socket.on('new-music', playPartyMusic);
    function playPartyMusic(url) {
      const audio = document.getElementById('partyMusic');
      audio.src = url;
      audio.volume = 0.8;
      audio.load();
      if (userInteracted) {
        audio.play().catch(e => console.log('music play error:', e));
      }
      document.getElementById('musicPlayerCard').style.display = 'block';
      document.getElementById('chat').innerHTML += `<div class="msg"><strong>پارتی:</strong> موزیک جدید! برقصین 🎉</div>`;
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }
    // Init audio با permission چک
    async function initAudio() {
  try {
    if (myStream) return;

    myStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    // ❌ هیچ audio ای برای صدای خودت نساز
    // فقط visualize
    visualize(myStream, socket.id);

  } catch (err) {
    console.error('Audio permission error:', err);
    alert('میکروفون اجازه نداد Brozone 😭');
  }
}

    // Force play همه audio بعد تعامل
    function forcePlayAllAudio() {
      document.querySelectorAll('audio').forEach(audio => {
        if (audio.srcObject && audio.paused) {
          audio.play().catch(e => console.log('force play failed:', e));
        }
      });
    }
    // WebRTC با SDP constraints
    socket.on('current-users', users => {
      if (!myStream) return;
      users.forEach(uid => uid !== socket.id && createPeer(uid, false));
    });
    socket.on('user-joined', newId => {
      if (!myStream) return;
      if (newId !== socket.id) createPeer(newId, true);
    });
    socket.on('user-left', leftId => {
      if (peers[leftId]) {
        peers[leftId].destroy();
        delete peers[leftId];
      }
      delete userAvatars[leftId];
      const audioEl = document.getElementById(leftId);
      if (audioEl) audioEl.remove();
      updateUserList(getUserListFromSocket()); // آپدیت لیست
    });
    socket.on('signal', data => {
      if (!peers[data.from]) createPeer(data.from, false);
      peers[data.from].signal(data.signal);
    });
    function createPeer(peerId, initiator) {
      if (peers[peerId]) return;
      const peer = new SimplePeer({
        initiator,
        stream: myStream,
        trickle: false,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }, // STUN اضافه
        offerOptions: { offerToReceiveAudio: 1 } // SDP constraint برای audio
      });
      peer.on('signal', signal => socket.emit('signal', { to: peerId, signal }));
      peer.on('stream', remoteStream => {
        console.log('Remote stream received:', remoteStream);
        addAudioStream(remoteStream, peerId);
        visualize(remoteStream, peerId);
      });
      peer.on('error', err => console.log('Peer error:', err));
      peers[peerId] = peer;
    }
    function addAudioStream(stream, id) {
      let audio = document.getElementById(id);
      if (!audio) {
        audio = document.createElement('audio');
        audio.id = id;
        audio.autoplay = true;
        audio.style.display = 'none';
        document.body.appendChild(audio);
      }
      audio.srcObject = stream;
      if (userInteracted) {
        audio.play().catch(e => {
          console.log('Remote audio play failed:', e);
          // Fallback: hidden muted local برای unblock
        });
      }
    }
    function visualize(stream, userId) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume(); // resume اگر suspended
        }
        const analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 512;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        function draw() {
          requestAnimationFrame(draw);
          analyser.getByteFrequencyData(dataArray);
          const volume = dataArray.reduce((a, b) => a + b) / bufferLength;
          const scale = 1 + (volume / 255) * 1.2; // قوی‌تر!
          const img = document.querySelector(`.user[data-user-id="${userId}"] img`);
          if (img) {
            img.style.transform = `scale(${Math.min(scale, 1.8)})`; // max scale محدود
          }
        }
        draw();
      } catch (e) {
        console.log('Visualizer error:', e);
      }
    }
    // Listen for ready
    socket.on('ready-for-peers', () => {
      if (myStream) {
        socket.emit('current-users', Array.from(io.sockets.sockets.keys()).filter(id => id !== socket.id));
      }
    });
  </script>
</body>
</html>
