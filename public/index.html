<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brozone Voice Party 💜🪩✨</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&family=Cute+Font&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon: #ff2e63;
      --purple: #a166ff;
      --cyan: #00f0ff;
      --bg: #0d001a;
      --card: #1a0033;
      --glow: rgba(255,46,99,0.7);
    }
    body {
      margin:0; padding:0;
      background: linear-gradient(135deg, #0d001a, #1a0033, #30004d);
      color:#fff;
      font-family:'Vazirmatn', sans-serif;
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      background: url('https://wallpapers.com/images/hd/neon-lights-anime-aesthetic-jabvk7ta2tu43041.jpg') center/cover no-repeat;
      opacity:0.15;
      z-index:-2;
      animation: bgFloat 80s infinite alternate;
    }
    @keyframes bgFloat { 0%{transform:scale(1.1) translate(0,0)} 100%{transform:scale(1.25) translate(5%,5%)} }
    .container { max-width:1100px; margin:0 auto; padding:20px; position:relative; z-index:1; }
    h1 {
      font-size:4.8em;
      text-align:center;
      background: linear-gradient(90deg, var(--neon), var(--purple), var(--cyan));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin:40px 0;
      text-shadow: 0 0 40px var(--glow);
      animation: titlePulse 3s infinite alternate;
    }
    @keyframes titlePulse { from {transform:scale(1)} to {transform:scale(1.08)} }
    .card {
      background: rgba(26,0,51,0.75);
      backdrop-filter: blur(12px);
      border-radius:28px;
      padding:35px;
      margin:30px 0;
      border:1px solid rgba(255,46,99,0.4);
      box-shadow: 0 0 50px rgba(255,46,99,0.5), inset 0 0 25px rgba(161,102,255,0.3);
      transition: all 0.5s;
      animation: cardPop 0.8s ease-out;
    }
    @keyframes cardPop { from {opacity:0; transform:scale(0.9)} to {opacity:1; transform:scale(1)} }
    .card:hover { transform: translateY(-12px); box-shadow: 0 0 70px var(--glow); }
    .users { display:flex; flex-wrap:wrap; gap:25px; justify-content:center; }
    .user {
      text-align:center;
      transition: all 0.5s;
      animation: float 6s infinite ease-in-out;
      position: relative;
    }
    .user img {
      width:110px; height:110px;
      border-radius:50%;
      border:5px solid transparent;
      background: linear-gradient(45deg, var(--neon), var(--purple));
      padding:5px;
      transition: all 0.4s;
      box-shadow: 0 0 20px rgba(255,46,99,0.5);
    }
    .user:hover img { transform:scale(1.2) rotate(10deg); }
    .user span {
      margin-top:15px;
      font-weight:bold;
      font-size:1.3em;
      text-shadow:0 0 10px var(--glow);
    }
    .mute-icon {
      position: absolute;
      top: 0;
      right: 0;
      font-size: 1.5em;
      color: #ff2e63;
      text-shadow: 0 0 10px var(--glow);
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
    .controls { text-align:center; margin:50px 0; }
    button {
      background: linear-gradient(45deg, var(--neon), var(--purple));
      color:white;
      border:none;
      padding:20px 45px;
      margin:20px;
      border-radius:50px;
      font-size:1.5em;
      cursor:pointer;
      box-shadow: 0 0 30px var(--glow);
      transition: all 0.4s;
      position:relative;
      overflow:hidden;
    }
    button::before {
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: translateX(-100%);
      transition: 0.7s;
    }
    button:hover::before { transform: translateX(100%); }
    button:hover { transform:scale(1.15) rotate(5deg); box-shadow: 0 0 50px var(--glow); }
    #chat {
      height:300px;
      overflow-y:scroll;
      background: rgba(26,0,51,0.6);
      padding:25px;
      border-radius:20px;
      margin-bottom:20px;
      backdrop-filter: blur(8px);
      border:1px solid rgba(0,240,255,0.2);
    }
    .msg {
      margin:15px 0;
      padding:15px;
      background: rgba(161,102,255,0.2);
      border-radius:20px;
      max-width:80%;
      backdrop-filter: blur(5px);
      animation: msgPop 0.5s ease-out;
    }
    @keyframes msgPop { from {opacity:0; transform:translateY(20px)} to {opacity:1; transform:translateY(0)} }
    input {
      padding:20px;
      width:75%;
      border-radius:50px;
      border:none;
      background: rgba(255,255,255,0.1);
      color:white;
      font-size:1.3em;
      backdrop-filter: blur(10px);
      transition: all 0.4s;
    }
    input:focus { outline:none; box-shadow: 0 0 30px var(--glow); }
    body.disco-active {
      animation: discoBg 8s linear infinite;
    }
    @keyframes discoBg {
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }
    body.disco-active .user img { animation: neonGlow 1s ease-in-out infinite alternate; }
    body.disco-active button { animation: pulse 1.2s infinite; }
    @keyframes neonGlow { from {box-shadow:0 0 20px #ff2e63, 0 0 40px #a166ff} to {box-shadow:0 0 40px #00f0ff, 0 0 80px #ff2e63} }
    #uploadProgress {
      display: none;
      margin: 20px auto;
      width: 80%;
      text-align: center;
    }
    progress {
      width: 100%;
      height: 20px;
      border-radius: 10px;
      background: rgba(255,46,99,0.3);
    }

    /* ⭐ استایل‌های خفن Share Screen */
    #screenShareCard {
      display:none;
      animation: cardPop 0.6s ease-out;
    }
    #screenContainer {
      display:flex;
      flex-direction:column;
      gap:30px;
      align-items:center;
    }
    .screen-wrapper {
      position:relative;
      border-radius:25px;
      overflow:hidden;
      box-shadow: 0 0 60px var(--glow), 0 0 100px rgba(161,102,255,0.6);
      animation: screenPulse 4s infinite alternate;
      transition: all 0.6s;
    }
    .screen-wrapper:hover {
      transform: scale(1.05) rotate(2deg);
      box-shadow: 0 0 100px var(--glow), 0 0 150px #00f0ff;
    }
    @keyframes screenPulse {
      from { box-shadow: 0 0 60px var(--glow); }
      to { box-shadow: 0 0 100px var(--glow), 0 0 60px #a166ff; }
    }
    .screen-wrapper video {
      width:100%;
      max-width:950px;
      border-radius:25px;
      display:block;
    }
    .screen-label {
      position:absolute;
      bottom:15px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,0.6);
      padding:10px 30px;
      border-radius:30px;
      font-weight:bold;
      backdrop-filter:blur(8px);
      border:2px solid var(--neon);
      box-shadow:0 0 20px var(--glow);
      animation: labelFloat 3s infinite ease-in-out;
    }
    @keyframes labelFloat { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-10px)} }
  </style>
</head>
<body>
  <div class="container">
    <h1>Brozone Voice Party 💜🪩✨</h1>
    <div class="card">
      <input type="text" id="nameInput" placeholder="اسم انیمه‌ای شیطونیت چیه؟ 😈" maxlength="20">
      <button onclick="setName()">استارت پارتی!</button>
    </div>
    <div class="card">
      <div id="online">آنلاین: ۱ نفر (تو تنهایی فعلاً 😂)</div>
      <div class="users" id="userList"></div>
    </div>
   
    <div class="card" id="screenShareCard">
      <h3 style="text-align:center;">👀 صفحه‌های شیطون در حال اشتراک 🖥️💥</h3>
      <div id="screenContainer"></div>
    </div>
   
    <div class="controls">
      <button id="mute">🔇 مات کردن میکروفون</button>
      <button id="disco">🪩 دیسکو روشن!</button>
      <button id="shareScreen">📺 اشتراک صفحه</button>
      <button id="uploadMusicBtn">🎵 آپلود و پخش موزیک!</button>
    </div>
   
    <div id="uploadProgress"><progress id="progressBar" value="0" max="100"></progress></div>
    <div class="card" id="musicPlayerCard" style="display:none;">
      <h3>🎶 موزیک پارتی (همه با هم گوش بدیم 😏)</h3>
      <audio id="partyMusic" controls autoplay style="width:100%;"></audio>
      <button onclick="document.getElementById('partyMusic').play()">▶ پلی دوباره</button>
    </div>
    <div class="card">
      <h3>چت متنی (که داد نزنیم 😏)</h3>
      <div id="chat"></div>
      <input type="text" id="msgInput" placeholder="یه نیش بامزه بنداز..." onkeypress="if(event.key==='Enter') sendMsg()">
    </div>
  </div>
 
  <input type="file" id="musicInput" accept="audio/*" style="display:none;">
  <audio id="joinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3" preload="auto"></audio>
  <audio id="leaveSound" src="https://assets.mixkit.co/sfx/preview/mixkit-negative-answer-little-beep-932.mp3" preload="auto"></audio>
 
  <script>
    const socket = io();
    let myStream, peers = {}, myName = "ناشناس شیطون";
    let isMuted = false, discoMode = false;
    let isHost = false;
    let partyAudio = null;
    let screenStream = null;
    let isSharingScreen = false;
   
    const animeAvatars = [
      "https://i.imgur.com/7z3f8kP.jpeg",
      "https://i.imgur.com/JdQAR2s.jpeg",
      "https://i.imgur.com/6f4p1kZ.jpeg",
      "https://i.imgur.com/8pK9p3Q.jpeg",
      "https://i.imgur.com/Vf2mK9r.jpeg",
      "https://i.imgur.com/Ht9pL5X.jpeg",
      "https://i.imgur.com/Kr8pQ2m.jpeg",
      "https://i.imgur.com/3qWvZ8Y.jpeg",
      "https://i.imgur.com/9pR5v2B.jpeg",
      "https://i.imgur.com/fG4mP7k.jpeg",
      "https://i.imgur.com/Lp9kM3v.jpeg",
      "https://i.imgur.com/2mV8qRt.jpeg",
      "https://i.pinimg.com/564x/f1/e0/3f/f1e03fa1e856886bbe9d328064761131.jpg",
      "https://i.ytimg.com/vi/newcvoVZKXE/hqdefault.jpg",
      "https://wallpapercave.com/wp/wp10123124.jpg"
    ];
   
    function setName() {
      myName = document.getElementById('nameInput').value.trim() || "Brozone جون";
      socket.emit('set-name', myName);
      document.querySelector('.card input').style.display = 'none';
      document.querySelector('.card button').style.display = 'none';
    }
   
    function sendMsg() {
      const input = document.getElementById('msgInput');
      if (input.value.trim()) {
        socket.emit('chat', input.value);
        input.value = '';
      }
    }
   
    socket.on('user-list', (users) => {
      document.getElementById('online').textContent = `آنلاین: ${users.length} نفر 🔥`;
      const list = document.getElementById('userList');
      list.innerHTML = users.map(u => `
        <div class="user" data-user-id="${u.id}">
          <img src="${animeAvatars[Math.floor(Math.random()*animeAvatars.length)]}">
          <span>${u.name}${u.isMuted ? ' <span class="mute-icon">🔇</span>' : ''}</span>
        </div>
      `).join('');
    });
   
    socket.on('chat', (data) => {
      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="msg"><strong>${data.name}:</strong> ${data.msg}</div>`;
      chat.scrollTop = chat.scrollHeight;
    });
   
    socket.on('user-joined', () => document.getElementById('joinSound').play());
    socket.on('user-left', () => document.getElementById('leaveSound').play());
   
    document.getElementById('mute').onclick = () => {
      if (!myStream) return;
      isMuted = !isMuted;
      myStream.getAudioTracks()[0].enabled = !isMuted;
      const btn = document.getElementById('mute');
      btn.textContent = isMuted ? '🔊 آنمات کردن' : '🔇 مات کردن میکروفون';
      btn.style.background = isMuted ? '#16213e' : 'linear-gradient(45deg, var(--neon), var(--purple))';
      socket.emit('toggle-mute', isMuted);
    };
   
    document.getElementById('disco').onclick = () => {
      discoMode = !discoMode;
      const btn = document.getElementById('disco');
      if (discoMode) {
        document.body.classList.add('disco-active');
        btn.textContent = '🪩 دیسکو خاموش!';
      } else {
        document.body.classList.remove('disco-active');
        btn.textContent = '🪩 دیسکو روشن!';
      }
    };
   
    document.getElementById('shareScreen').onclick = async () => {
      if (!isSharingScreen) {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
          const screenTrack = screenStream.getVideoTracks()[0];
          Object.values(peers).forEach(peer => {
            const sender = peer._pc.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) {
              sender.replaceTrack(screenTrack);
            } else {
              peer._pc.addTrack(screenTrack, screenStream);
            }
          });
          screenTrack.onended = stopScreenShare;
          isSharingScreen = true;
          document.getElementById('shareScreen').textContent = '❌ توقف اشتراک';
        } catch (err) {
          alert('اجازه Share Screen ندادی Brozone! 😤 یا کنسل کردی');
        }
      } else {
        stopScreenShare();
      }
    };
   
    function stopScreenShare() {
      if (!screenStream) return;
      screenStream.getTracks().forEach(t => t.stop());
      screenStream = null;
      isSharingScreen = false;
      document.getElementById('shareScreen').textContent = '📺 اشتراک صفحه';
    }
   
    function addRemoteScreen(stream, peerId) {
      document.getElementById('screenShareCard').style.display = 'block';
      if (document.getElementById('wrapper-' + peerId)) return;
     
      const wrapper = document.createElement('div');
      wrapper.className = 'screen-wrapper';
      wrapper.id = 'wrapper-' + peerId;
     
      const video = document.createElement('video');
      video.id = 'screen-' + peerId;
      video.srcObject = stream;
      video.autoplay = true;
      video.playsInline = true;
     
      const label = document.createElement('div');
      label.className = 'screen-label';
      label.textContent = `${myName === "ناشناس شیطون" ? 'شیطون ناشناس' : getUserName(peerId)} داره share می‌کنه 😏`;
     
      wrapper.appendChild(video);
      wrapper.appendChild(label);
      document.getElementById('screenContainer').appendChild(wrapper);
    }
   
    function getUserName(peerId) {
      // placeholder ساده – اگه لیست کاربرها رو داشتی بهتر می‌شه
      return 'دوست انیمه‌ای';
    }
   
    document.getElementById('uploadMusicBtn').onclick = () => {
      document.getElementById('musicInput').click();
    };
   
    document.getElementById('musicInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('audio/')) {
        alert('این که موزیک نیست Brozone! یه فایل صوتی بده 😤');
        return;
      }
      const formData = new FormData();
      formData.append('music', file);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload-music', true);
      xhr.upload.onprogress = (event) => {
        if (event.lengthComputable) {
          const percent = (event.loaded / event.total) * 100;
          document.getElementById('progressBar').value = percent;
        }
      };
      xhr.onload = () => {
        if (xhr.status === 200) {
          const data = JSON.parse(xhr.responseText);
          isHost = true;
          playPartyMusic(data.url, { playing: true, currentTime: 0 });
        } else {
          alert('آپلود نشد Brozone! 😭');
        }
        document.getElementById('uploadProgress').style.display = 'none';
      };
      xhr.onerror = () => {
        alert('خطا در آپلود 😤');
        document.getElementById('uploadProgress').style.display = 'none';
      };
      document.getElementById('uploadProgress').style.display = 'block';
      document.getElementById('progressBar').value = 0;
      xhr.send(formData);
    };
   
    function playPartyMusic(url, state) {
      partyAudio = document.getElementById('partyMusic');
      partyAudio.src = url;
      partyAudio.controls = isHost;
      partyAudio.currentTime = state.currentTime || 0;
      if (state.playing) {
        partyAudio.play().catch(() => {});
      } else {
        partyAudio.pause();
      }
      document.getElementById('musicPlayerCard').style.display = 'block';
      document.getElementById('chat').innerHTML += `<div class="msg"><strong>رادیو پارتی:</strong> موزیک جدید پخش شد! همه برقصین 🎉🔥</div>`;
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }
   
    socket.on('music-sync', ({url, state}) => playPartyMusic(url, state));
   
    socket.on('music-state-update', (state) => {
      if (!partyAudio) return;
      if (Math.abs(partyAudio.currentTime - state.currentTime) > 0.5) {
        partyAudio.currentTime = state.currentTime;
      }
      if (state.playing && partyAudio.paused) partyAudio.play();
      if (!state.playing && !partyAudio.paused) partyAudio.pause();
    });
   
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        myStream = stream;
        visualize(stream, socket.id);
       
        socket.on('current-users', (users) => {
          users.forEach(userId => {
            if (userId !== socket.id) createPeer(userId, false);
          });
        });
       
        socket.on('user-joined', (newUserId) => {
          if (newUserId !== socket.id) createPeer(newUserId, true);
        });
       
        socket.on('user-left', (leftId) => {
          if (peers[leftId]) {
            peers[leftId].destroy();
            delete peers[leftId];
          }
          const wrapper = document.getElementById('wrapper-' + leftId);
          if (wrapper) wrapper.remove();
        });
       
        socket.on('signal', (data) => {
          if (!peers[data.from]) createPeer(data.from, false);
          peers[data.from].signal(data.signal);
        });
      })
      .catch(() => alert('میکروفون بده دیگه Brozone! 😤 بدون صدا پارتی نمیشه که 😭'));
   
    function createPeer(peerId, initiator) {
      if (peers[peerId]) return;
      const peer = new SimplePeer({
        initiator,
        stream: myStream,
        trickle: false,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });
     
      peer.on('signal', signal => socket.emit('signal', { to: peerId, signal }));
     
      peer.on('stream', remoteStream => {
        if (remoteStream.getVideoTracks().length > 0) {
          addRemoteScreen(remoteStream, peerId);
        } else {
          addRemoteAudio(remoteStream, peerId);
          visualize(remoteStream, peerId);
        }
      });
     
      peer.on('close', () => delete peers[peerId]);
     
      peers[peerId] = peer;
    }
   
    function addRemoteAudio(stream, peerId) {
      if (document.getElementById(peerId)) return;
      const audio = document.createElement('audio');
      audio.srcObject = stream;
      audio.id = peerId;
      audio.autoplay = true;
      audio.play().catch(e => console.log("autoplay blocked:", e));
      document.body.appendChild(audio);
    }
   
    function visualize(stream, userId) {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
     
      function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);
        let volume = dataArray.reduce((a, b) => a + b) / bufferLength / 255;
        const userDiv = document.querySelector(`.user[data-user-id="${userId}"] img`);
        if (userDiv) {
          userDiv.style.transform = `scale(${1 + volume * 0.5})`;
        }
      }
      draw();
    }
   
    setInterval(() => {
      if (isHost && partyAudio) {
        socket.emit('music-state-update', {
          playing: !partyAudio.paused,
          currentTime: partyAudio.currentTime
        });
      }
    }, 2000);
  </script>
</body>
</html>
